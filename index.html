<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDTools — All-in-One Utility Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--surface:#111827;--card:#141c2f;--card-h:#1a2540;
  --border:#1e2d47;--border-h:#2a3f5f;
  --text:#e2e8f0;--muted:#64748b;--dim:#94a3b8;
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,0.1);
  --teal:#14b8a6;--purple:#8b5cf6;--amber:#f59e0b;--red:#ef4444;--green:#22c55e;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 800px 500px at 20% -10%,rgba(59,130,246,0.06) 0%,transparent 60%),radial-gradient(ellipse 600px 400px at 80% 100%,rgba(139,92,246,0.05) 0%,transparent 60%);pointer-events:none;z-index:0}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{font-size:20px;font-weight:700;color:#fff;padding:8px 12px 20px;letter-spacing:-0.5px}
.sidebar-logo span{color:var(--blue)}
.sidebar-section{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;margin-top:8px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);border:none;background:none;color:var(--dim);font-size:13px;font-family:inherit;cursor:pointer;width:100%;text-align:left;transition:all 0.15s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--blue-bg);color:var(--blue)}
.nav-count{margin-left:auto;font-size:11px;background:var(--border);padding:1px 6px;border-radius:20px;color:var(--muted)}
.main{flex:1;padding:28px 32px;overflow-y:auto;min-width:0}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;color:#fff;flex:1}
.search-wrap{position:relative;width:300px}
.search-wrap input{width:100%;padding:10px 16px 10px 40px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:all 0.15s}
.search-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.sort-info{font-size:13px;color:var(--muted);white-space:nowrap}
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all 0.18s;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;text-align:left}
.tool-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(59,130,246,0.04),transparent);opacity:0;transition:opacity 0.18s}
.tool-card:hover{background:var(--card-h);border-color:var(--border-h);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.3)}
.tool-card:hover::before{opacity:1}
.tc-top{display:flex;align-items:flex-start;gap:12px}
.tc-icon{width:36px;height:36px;border-radius:9px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tc-info{flex:1;min-width:0}
.tc-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:3px}
.tc-desc{font-size:12px;color:var(--muted);line-height:1.4}
.tc-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);color:var(--muted);font-weight:500}
.tag.blue{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.3);color:#93c5fd}
.badge-new{position:absolute;top:10px;right:10px;background:var(--teal);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;letter-spacing:0.05em}
.tool-card.hidden{display:none}
.tool-panel{display:none;background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.tool-panel.active{display:block}
.tp-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.tp-back{background:none;border:1px solid var(--border);color:var(--dim);padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;transition:all 0.15s}
.tp-back:hover{background:var(--card);color:var(--text)}
.tp-icon{width:40px;height:40px;border-radius:10px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.tp-title{font-size:18px;font-weight:700;color:#fff}
.tp-desc{font-size:13px;color:var(--muted)}
.tp-body{padding:24px}
label{font-size:13px;font-weight:500;color:var(--dim);display:block;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border 0.15s;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
textarea{min-height:120px}
.form-row{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb;transform:translateY(-1px)}
.btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--dim)}
.btn-secondary:hover{background:var(--card-h);color:var(--text)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#16a34a}
.btn-purple{background:var(--purple);color:#fff}
.btn-amber{background:var(--amber);color:#000}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-top:16px;font-size:14px;line-height:1.7;color:var(--text);word-break:break-all}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.result-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center}
.result-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px}
.result-value{font-size:22px;font-weight:700;color:var(--blue)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
pre{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;overflow:auto;font-size:13px;line-height:1.6;color:#a5f3fc;max-height:400px}
.copy-btn{font-size:12px;padding:4px 10px;background:var(--border);border:none;border-radius:6px;color:var(--muted);cursor:pointer;transition:all 0.15s;font-family:inherit}
.copy-btn:hover{background:var(--blue);color:#fff}
.status-ok{color:var(--green);font-weight:600}
.status-err{color:var(--red);font-weight:600}
hr.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.color-preview{width:100%;height:80px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:8px;transition:background 0.2s}
.emoji-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-height:300px;overflow-y:auto}
.emoji-btn{font-size:22px;padding:6px;border:none;background:var(--card);border-radius:6px;cursor:pointer;transition:transform 0.1s}
.emoji-btn:hover{transform:scale(1.2)}
.diff-line{padding:2px 8px;font-size:13px;font-family:monospace;border-radius:4px}
.diff-add{background:rgba(34,197,94,0.1);color:var(--green)}
.diff-del{background:rgba(239,68,68,0.1);color:var(--red)}
.diff-same{color:var(--muted)}
.filter-thumb{width:80px;height:60px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;object-fit:cover}
.filter-thumb.active{border-color:var(--blue)}
.filter-grid{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.filter-item{text-align:center;font-size:11px;color:var(--muted)}
#scanner-canvas,#editor-canvas,#filter-canvas{max-width:100%;border-radius:12px;border:1px solid var(--border);display:block}
input[type=range]{width:100%;accent-color:var(--blue);margin:4px 0}
.info-box{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#93c5fd;margin-bottom:16px}
.warn-box{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#fcd34d;margin-bottom:16px}
.sample-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:28px;font-weight:900;color:rgba(239,68,68,0.25);pointer-events:none;letter-spacing:4px;white-space:nowrap}
@media(max-width:900px){.sidebar{display:none}.tools-grid{grid-template-columns:repeat(2,1fr)}.main{padding:20px 16px}}
@media(max-width:580px){.tools-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>

// ── RENDER ──
function renderCards(list){
  const g=document.getElementById('tools-grid');
  g.innerHTML=list.map(t=>`
    <div class="tool-card" onclick="openTool('${t.id}')">
      ${t.isNew?'<span class="badge-new">NEW</span>':''}
      <div class="tc-top">
        <div class="tc-icon">${t.icon}</div>
        <div class="tc-info"><div class="tc-name">${t.name}</div><div class="tc-desc">${t.desc}</div></div>
      </div>
      <div class="tc-tags">${t.tags.slice(0,3).map(tg=>`<span class="tag blue">${tg}</span>`).join('')}</div>
    </div>`).join('');
  document.getElementById('sort-info').textContent=`Showing ${list.length} of ${TOOLS.length} tools`;
}
let activeFilter='all';
function filterCat(cat,btn){activeFilter=cat;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyFilters();}
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  let list=TOOLS;
  if(activeFilter!=='all') list=list.filter(t=>t.tags.some(tg=>tg===activeFilter));
  if(q) list=list.filter(t=>t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q));
  renderCards(list);
}
function openTool(id){
  const t=TOOLS.find(x=>x.id===id);if(!t) return;
  const html=PANELS[id]?PANELS[id](t):`<div class="warn-box">This tool is coming soon!</div>`;
  document.getElementById('home-view').style.display='none';
  document.getElementById('tool-view').innerHTML=`
    <div class="tool-panel active">
      <div class="tp-header">
        <button class="tp-back" onclick="closeTool()">← Back</button>
        <div class="tp-icon">${t.icon}</div>
        <div><div class="tp-title">${t.name}</div><div class="tp-desc">${t.desc}</div></div>
      </div>
      <div class="tp-body">${html}</div>
    </div>`;
  if(INITS[id]) setTimeout(()=>INITS[id](),60);
  window.scrollTo(0,0);
}
function closeTool(){document.getElementById('home-view').style.display='';document.getElementById('tool-view').innerHTML='';}
function copyText(el){const t=el.dataset.copy||'';navigator.clipboard.writeText(t).then(()=>{const o=el.textContent;el.textContent='Copied!';setTimeout(()=>el.textContent=o,1500)});}
function loadScript(src,cb){if(document.querySelector(`script[src="${src}"]`)){cb&&cb();return;}const s=document.createElement('script');s.src=src;s.onload=cb;document.head.appendChild(s);}

const PANELS={},INITS={};

// ══════════════════════════════════════════════
// 1. CAMERA SCANNER
// ══════════════════════════════════════════════
PANELS['cam-scanner']=()=>`

<div class="form-row"><label>Upload Document Photo</label>
  <input type="file" id="cs-file" accept="image/*" onchange="csLoadImage()" style="color:var(--text)">
</div>
<div id="cs-controls" style="display:none">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">

    <button class="btn btn-secondary" onclick="csEffect('enhance')">✨ Enhance</button>
    <button class="btn btn-secondary" onclick="csEffect('original')">🖼️ Original</button>
    <button class="btn btn-secondary" onclick="csRotate()">↻ Rotate 90°</button>
  </div>
  <div class="form-grid">
    <div><label>Brightness: <span id="cs-bl">100</span>%</label><input type="range" min="50" max="200" value="100" id="cs-b" oninput="document.getElementById('cs-bl').textContent=this.value;csApplyAdj()"></div>
    <div><label>Contrast: <span id="cs-cl">100</span>%</label><input type="range" min="50" max="300" value="100" id="cs-c" oninput="document.getElementById('cs-cl').textContent=this.value;csApplyAdj()"></div>
  </div>
  <canvas id="scanner-canvas" style="max-width:100%;border-radius:12px;border:1px solid var(--border);display:block;margin-bottom:16px"></canvas>
  <div class="btn-row">
    <button class="btn btn-green" onclick="csDownloadPDF()">⬇ Download PDF</button>
    <button class="btn btn-secondary" onclick="csDownloadPNG()">⬇ Download PNG</button>
  </div>
</div>`;
let csImg=null,csRotDeg=0,csCurrentEffect='original';
window.csLoadImage=function(){
  const f=document.getElementById('cs-file').files[0];if(!f)return;
  const img=new Image();img.onload=()=>{csImg=img;csRotDeg=0;document.getElementById('cs-controls').style.display='block';csRender();};
  img.src=URL.createObjectURL(f);
};
window.csEffect=function(e){csCurrentEffect=e;csRender();}
window.csRotate=function(){csRotDeg=(csRotDeg+90)%360;csRender();}
window.csApplyAdj=function(){csRender();}
function csRender(){
  if(!csImg) return;
  const c=document.getElementById('scanner-canvas');
  const rotated=csRotDeg===90||csRotDeg===270;
  c.width=rotated?csImg.height:csImg.width;c.height=rotated?csImg.width:csImg.height;
  const ctx=c.getContext('2d');
  ctx.save();ctx.translate(c.width/2,c.height/2);ctx.rotate(csRotDeg*Math.PI/180);
  ctx.drawImage(csImg,-csImg.width/2,-csImg.height/2);ctx.restore();
  const bright=+document.getElementById('cs-b').value/100;
  const contr=+document.getElementById('cs-c').value/100;
  const id=ctx.getImageData(0,0,c.width,c.height);const d=id.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    r=Math.min(255,r*bright);g=Math.min(255,g*bright);b=Math.min(255,b*bright);
    r=Math.min(255,Math.max(0,((r/255-0.5)*contr+0.5)*255));
    g=Math.min(255,Math.max(0,((g/255-0.5)*contr+0.5)*255));
    b=Math.min(255,Math.max(0,((b/255-0.5)*contr+0.5)*255));
    if(csCurrentEffect==='gray'||csCurrentEffect==='bw'){const gr=0.299*r+0.587*g+0.114*b;r=g=b=gr;}
    if(csCurrentEffect==='bw'){const t=r>128?255:0;r=g=b=t;}
    if(csCurrentEffect==='enhance'){r=Math.min(255,r*1.1);g=Math.min(255,g*1.1);b=Math.min(255,b*1.1);}
    d[i]=r;d[i+1]=g;d[i+2]=b;
  }
  ctx.putImageData(id,0,0);
}
window.csDownloadPNG=function(){
  const a=document.createElement('a');a.download='scanned.png';a.href=document.getElementById('scanner-canvas').toDataURL();a.click();
};
window.csDownloadPDF=function(){
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>{
    const c=document.getElementById('scanner-canvas');
    const {jsPDF}=window.jspdf;
    const w=c.width,h=c.height;
    const orient=w>h?'l':'p';
    const pdf=new jsPDF({orientation:orient,unit:'px',format:[w,h]});
    pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
    pdf.save('scanned-document.pdf');
  });
};

  let y=ref.getFullYear()-dob.getFullYear(),m=ref.getMonth()-dob.getMonth(),d=ref.getDate()-dob.getDate();

<div class="form-row"><label>Upload Image</label><input type="file" id="bf-file" accept="image/*" onchange="bfLoad()" style="color:var(--text)"></div>
<div id="bf-controls" style="display:none">
  <div class="form-row"><label>Blur Strength: <span id="bf-sl">15</span></label><input type="range" min="5" max="40" value="15" id="bf-s" oninput="document.getElementById('bf-sl').textContent=this.value"></div>
  <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Click and drag on image to blur a region</div>
  <canvas id="bf-canvas" style="max-width:100%;cursor:crosshair;border-radius:12px;border:1px solid var(--border)"></canvas>
  <div class="btn-row" style="margin-top:12px">
    <button class="btn btn-primary" onclick="bfDownload()">⬇ Download</button>
    <button class="btn btn-secondary" onclick="bfUndo()">↩ Undo Last</button>
  </div>
</div>`;
let bfCtx,bfW,bfH,bfHistory=[];
window.bfLoad=function(){
  const img=new Image();img.onload=()=>{
    const c=document.getElementById('bf-canvas');
    bfW=img.width;bfH=img.height;
    const scale=Math.min(1,700/bfW);c.width=bfW*scale;c.height=bfH*scale;
    bfCtx=c.getContext('2d');bfCtx.drawImage(img,0,0,c.width,c.height);
    bfHistory=[bfCtx.getImageData(0,0,c.width,c.height)];
    document.getElementById('bf-controls').style.display='block';
    let dragging=false,sx,sy;
    c.onmousedown=e=>{const r=c.getBoundingClientRect();sx=e.clientX-r.left;sy=e.clientY-r.top;dragging=true;};
    c.onmouseup=e=>{
      if(!dragging)return;dragging=false;
      const r=c.getBoundingClientRect();const ex=e.clientX-r.left,ey=e.clientY-r.top;
      const x=Math.min(sx,ex),y=Math.min(sy,ey),w=Math.abs(ex-sx),h=Math.abs(ey-sy);
      if(w<5||h<5)return;
      const str=+document.getElementById('bf-s').value;
      bfHistory.push(bfCtx.getImageData(0,0,c.width,c.height));
      bfBlurRegion(bfCtx,x,y,w,h,str);
    };
  };img.src=URL.createObjectURL(document.getElementById('bf-file').files[0]);
};
function bfBlurRegion(ctx,x,y,w,h,r){
  const id=ctx.getImageData(x,y,w,h);const d=id.data;
  for(let i=0;i<h;i+=r) for(let j=0;j<w;j+=r){
    let ra=0,ga=0,ba=0,cnt=0;
    for(let di=0;di<r&&i+di<h;di++) for(let dj=0;dj<r&&j+dj<w;dj++){
      const idx=((i+di)*w+(j+dj))*4;ra+=d[idx];ga+=d[idx+1];ba+=d[idx+2];cnt++;
    }
    ra=ra/cnt;ga=ga/cnt;ba=ba/cnt;
    for(let di=0;di<r&&i+di<h;di++) for(let dj=0;dj<r&&j+dj<w;dj++){
      const idx=((i+di)*w+(j+dj))*4;d[idx]=ra;d[idx+1]=ga;d[idx+2]=ba;
    }
  }
  ctx.putImageData(id,x,y);
}
window.bfUndo=function(){if(bfHistory.length>1){bfHistory.pop();bfCtx.putImageData(bfHistory[bfHistory.length-1],0,0);}};
window.bfDownload=function(){const a=document.createElement('a');a.download='blurred.png';a.href=document.getElementById('bf-canvas').toDataURL();a.click();};

</div>

function hexToRgb(h){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return r?[parseInt(r[1],16),parseInt(r[2],16),parseInt(r[3],16)]:null;}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h,s,l=(mx+mn)/2;if(mx===mn){h=s=0;}else{const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;}h/=6;}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
window.updateColor=function(){const h=document.getElementById('cl-pick').value;document.getElementById('cl-hex').value=h;showColor(h);};
window.hexChanged=function(){const h=document.getElementById('cl-hex').value;if(/^#[0-9a-f]{6}$/i.test(h)){document.getElementById('cl-pick').value=h;showColor(h);}};
function showColor(h){document.getElementById('cl-preview').style.background=h;const rgb=hexToRgb(h);if(!rgb)return;const hsl=rgbToHsl(...rgb);const items=[{l:'HEX',v:h.toUpperCase()},{l:'RGB',v:`rgb(${rgb.join(', ')})`},{l:'HSL',v:`hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`},{l:'RGBA',v:`rgba(${rgb.join(', ')}, 1)`},{l:'R',v:rgb[0]},{l:'G',v:rgb[1]},{l:'B',v:rgb[2]}];document.getElementById('cl-results').innerHTML=items.map(i=>`<div class="result-item"><div class="result-label">${i.l}</div><div style="font-size:13px;font-weight:600;color:var(--text)">${i.v}</div><button class="copy-btn" data-copy="${i.v}" onclick="copyText(this)" style="margin-top:4px">Copy</button></div>`).join('');}
INITS['color']=()=>showColor('#3b82f6');

window.extractText=function(){

      const worker=await Tesseract.createWorker(lang,1,{logger:m=>{if(m.status==='recognizing text') document.getElementById('it-status').textContent=`Recognizing: ${Math.round(m.progress*100)}%`;}});
      const{data:{text}}=await worker.recognize(file);
      await worker.terminate();
      document.getElementById('it-result').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span style="font-size:13px;color:var(--muted)">Extracted Text</span><button class="copy-btn" data-copy="${text.replace(/"/g,'&quot;')}" onclick="copyText(this)">Copy</button></div><textarea style="height:200px;margin-top:8px">${text}</textarea>`;

<div id="ie-result"></div>`;
const EBLOCKS=['⬛','🟫','🟥','🟧','🟨','🟩','🟦','🟪','⬜','🔲','🟤','🔴','🟠','🟡','🟢','🔵','🟣','⚫','⚪'];
window.imgEmojiArt=function(){
  const f=document.getElementById('ie-file').files[0];if(!f)return;
  const cols=+document.getElementById('ie-r').value;
  const img=new Image();img.onload=()=>{
    const rows=Math.floor(cols*(img.height/img.width)*0.6);
    const c=document.createElement('canvas');c.width=cols;c.height=rows;
    const ctx=c.getContext('2d');ctx.drawImage(img,0,0,cols,rows);
    const d=ctx.getImageData(0,0,cols,rows).data;
    let out='';
    for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){const i=(y*cols+x)*4;const b=Math.round((d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255*(EBLOCKS.length-1));out+=EBLOCKS[b];}out+='\n';}
    document.getElementById('ie-result').innerHTML=`<div style="font-size:14px;line-height:1.2;margin-top:12px;overflow-x:auto;max-height:400px;overflow-y:auto;background:var(--card);padding:12px;border-radius:8px;font-family:monospace">${out}</div>`;
  };img.src=URL.createObjectURL(f);
};

window.oeRotate=function(deg){oeRot=(oeRot+deg+360)%360;oeRender();};

window.oeReset=function(){oeRot=0;oeFlipH=oeFlipV=oeIsGray=false;['oe-b','oe-c','oe-s','oe-bl2'].forEach(id=>{document.getElementById(id).value=id==='oe-bl2'?0:100;});['oe-bl','oe-cl','oe-sl'].forEach(id=>{document.getElementById(id).textContent=100;});document.getElementById('oe-bll').textContent=0;oeRender();};

<div id="uc-result"></div>`;
const UC={length:{units:['Meter','Kilometer','Centimeter','Millimeter','Mile','Yard','Foot','Inch'],toBase:[1,1000,0.01,0.001,1609.344,0.9144,0.3048,0.0254]},weight:{units:['Kilogram','Gram','Milligram','Pound','Ounce','Ton'],toBase:[1,0.001,0.000001,0.453592,0.0283495,1000]},temp:{units:['Celsius','Fahrenheit','Kelvin'],toBase:null},data:{units:['Byte','Kilobyte','Megabyte','Gigabyte','Terabyte'],toBase:[1,1024,1048576,1073741824,1099511627776]},speed:{units:['m/s','km/h','mph','knots'],toBase:[1,0.277778,0.44704,0.514444]}};
window.updateUcUnits=function(){const cat=document.getElementById('uc-cat').value;const units=UC[cat].units;['uc-from','uc-to'].forEach((id,i)=>{document.getElementById(id).innerHTML=units.map((u,j)=>`<option value="${j}" ${(i===0&&j===0)||(i===1&&j===1)?'selected':''}>${u}</option>`).join('');});convertUnit();};
window.convertUnit=function(){const cat=document.getElementById('uc-cat').value;const val=+document.getElementById('uc-val').value;const fi=+document.getElementById('uc-from').value,ti=+document.getElementById('uc-to').value;let result;if(cat==='temp'){const from=UC.temp.units[fi],to=UC.temp.units[ti];let c=val;if(from==='Fahrenheit')c=(val-32)*5/9;else if(from==='Kelvin')c=val-273.15;if(to==='Celsius')result=c;else if(to==='Fahrenheit')result=c*9/5+32;else result=c+273.15;}else{const base=val*UC[cat].toBase[fi];result=base/UC[cat].toBase[ti];}document.getElementById('uc-result').innerHTML=`<div class="result-box" style="margin-top:12px;text-align:center"><span style="font-size:28px;font-weight:700;color:var(--blue)">${+result.toPrecision(8)}</span><span style="font-size:16px;color:var(--muted);margin-left:8px">${UC[cat].units[ti]}</span></div>`;};
INITS['unit-convert']=()=>updateUcUnits();

// ══════════════════════════════════════════════
// 51. API TESTER
// ══════════════════════════════════════════════
PANELS['api']=()=>`
<div class="form-grid"><div><label>Method</label><select id="at-m"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>PATCH</option></select></div><div><label>URL</label><input type="text" id="at-url" value="https://jsonplaceholder.typicode.com/posts/1"></div></div>
<div class="form-row"><label>Headers (JSON)</label><textarea id="at-h" style="min-height:60px">{}</textarea></div>
<div class="form-row"><label>Body (POST/PUT)</label><textarea id="at-b" style="min-height:70px" placeholder='{"key":"value"}'></textarea></div>
<button class="btn btn-primary" onclick="testApi()">Send Request</button>
<div id="at-result"></div>`;
window.testApi=async function(){const url=document.getElementById('at-url').value;const method=document.getElementById('at-m').value;document.getElementById('at-result').innerHTML='<div class="result-box" style="margin-top:12px;color:var(--muted)">🔄 Sending...</div>';try{let headers={};try{headers=JSON.parse(document.getElementById('at-h').value);}catch(e){}const opts={method,headers};if(['POST','PUT','PATCH'].includes(method)&&document.getElementById('at-b').value)opts.body=document.getElementById('at-b').value;const t0=Date.now();const res=await fetch(url,opts);const time=Date.now()-t0;const body=await res.text();let pretty=body;try{pretty=JSON.stringify(JSON.parse(body),null,2);}catch(e){}const sc=res.ok?'var(--green)':'var(--red)';document.getElementById('at-result').innerHTML=`<div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap"><div class="result-item"><div class="result-label">Status</div><div class="result-value" style="color:${sc};font-size:16px">${res.status}</div></div><div class="result-item"><div class="result-label">Time</div><div class="result-value" style="font-size:16px">${time}ms</div></div><div class="result-item"><div class="result-label">Size</div><div class="result-value" style="font-size:16px">${(body.length/1024).toFixed(1)}KB</div></div></div><pre style="margin-top:12px">${pretty}</pre>`;}catch(e){document.getElementById('at-result').innerHTML=`<div class="result-box" style="margin-top:12px"><span class="status-err">Error: ${e.message}</span></div>`;}};

renderCards(TOOLS);
